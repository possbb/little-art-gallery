<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>丫丫画作 · 图片与视频</title><meta name="description" content="收藏小娃的每一幅画，留住天马行空的小世界。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d4ce3'/%3E%3Cpath d='M9 23l3-8 9-9 5 5-9 9z' fill='%23ffdc67'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css"><script>window.GALLERY_PUBLIC_BACKEND="https://yaya-art-gallery.possbb.chatgpt.site";</script><script type="module" src="./app.js"></script>
</head>
<body>
  <header><a class="brand" href="./" aria-label="丫丫画作首页"><span class="brand-mark">丫</span><span>丫丫画作<small>LITTLE ART, BIG WORLD</small></span></a><div class="collection-note"><span>每一笔，都只有这一次。</span><small>给小画家的成长纪念</small></div><select id="families" aria-label="切换家庭" hidden></select><button id="family-settings" class="secondary" hidden>家庭管理</button><button id="admin" class="secondary" hidden>邀请管理</button><button id="login" class="secondary">上传与管理</button><button class="primary" id="add" hidden>＋ 上传作品</button></header>
  <main>
    
    <section aria-labelledby="gallery-title"><div class="gallery-head"><h2 id="gallery-title">全部作品 <span id="count">0</span></h2><div class="view-switch" aria-label="展示版本"><button data-view="all" class="active" aria-pressed="true">全部</button><button data-view="clean" aria-pressed="false">电子版</button><button data-view="original" aria-pressed="false">原始画作</button><button data-view="video" aria-pressed="false">视频版</button></div></div><p id="status" role="status">正在打开画廊…</p><div id="gallery" class="gallery"></div></section>
    <footer><span>丫丫画作 · 每一幅都值得留下</span><span>图片与视频 · 在线同步</span></footer>
  </main>
  <dialog id="detail"><div class="dialog-head"><span>作品档案</span><button class="icon" data-close="detail" aria-label="关闭作品">×</button></div><div class="detail-body"><div class="detail-image"><figure id="version-video"><video id="detail-video" controls loop playsinline preload="metadata" hidden></video><figcaption><button id="show-video">视频版</button></figcaption><p id="video-error" class="hint" hidden>浏览器无法播放此视频，请下载观看。</p></figure><figure id="version-clean"><div class="media-stage"><img id="detail-img" alt=""></div><figcaption><button id="show-clean">电子版</button></figcaption></figure><figure id="version-original"><div class="media-stage"><img id="original-img" alt=""></div><figcaption><button id="show-original">原图</button></figcaption></figure></div><div class="detail-copy"><p class="eyebrow">A LITTLE MASTERPIECE</p><h2 id="detail-title"></h2><p id="detail-date"></p><p id="detail-notes"></p><p id="detail-state" class="hint"></p><div class="detail-actions"><a class="primary" id="download" download>下载当前文件 ↓</a><button id="edit" class="secondary" hidden>修改名称与资料</button><button id="clean-art" class="secondary" hidden>生成电子版 · 清理背景</button><button id="merge-video" class="secondary" hidden>合并已有视频</button><button id="upload-clean" class="secondary" hidden>上传电子版</button><button id="upload-original" class="secondary" hidden>更换原图</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><button id="attach-video" class="secondary" hidden>添加视频版</button><input id="video-file" type="file" accept="video/mp4,video/webm" hidden><button id="delete-art" class="secondary danger" hidden>删除作品</button><p id="detail-error" role="alert"></p></div></div></div></dialog>
  <dialog id="merge-dialog"><form id="merge-form" class="form-content"><h2>合并已有视频</h2><label>选择对应的视频作品<select id="merge-source" required></select></label><p class="hint">合并后视频和画作一起展示，原文件保留。</p><p id="merge-error" role="alert"></p><button class="primary" id="merge-save">合并</button><button type="button" class="secondary" data-close="merge-dialog">取消</button></form></dialog><dialog id="editor"><form id="art-form"><div class="dialog-head"><h2 id="editor-title">上传作品</h2><button type="button" class="icon" data-close="editor" aria-label="关闭编辑">×</button></div><div class="form-content"><label>作品 / 文件名称<input name="title" required maxlength="100" placeholder="为作品起个名字"></label><label id="file-label" class="file-label">选择图片或视频<input name="file" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm"><small>图片：PNG / JPG / WebP；视频：MP4 / WebM。最多 50 MB。</small></label><div id="metadata-fields"><label>创作日期 <span class="optional">选填</span><input name="date" type="date"></label><label>画作小故事 <span class="optional">选填</span><textarea name="notes" maxlength="2000" rows="3"></textarea></label></div><p class="hint" id="upload-hint">上传后同步到当前家庭，仅家庭成员和持有已启用分享链接的人可见。图片上传后可在作品详情生成电子版。视频建议使用 H.264 MP4。</p><progress id="upload-progress" max="100" value="0" hidden></progress><p id="form-error" role="alert"></p><button class="primary" id="save" type="submit">保存作品</button></div></form></dialog><dialog id="account-dialog"><div class="dialog-head"><h2 id="account-heading">邮箱登录</h2><button class="icon" id="account-close" aria-label="关闭">×</button></div><div class="form-content" id="account-content"></div><p id="account-error" role="alert"></p></dialog></body></html>
